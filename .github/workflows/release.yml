name: Validate and publish module
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: module-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate scripts and packaging
        run: |
          for file in service.sh uninstall.sh customize.sh bin/daemon.sh; do sh -n "$file"; done
          python3 -m unittest discover -s tests -v
      - name: Build module with verified dependencies
        run: python3 scripts/package.py
      - name: Publish first release of this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version=//p' module.prop)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" dist/*.zip dist/*.sha256 \
              --target "$GITHUB_SHA" --prerelease \
              --title "Hotspot TTL 65 $TAG (experimental)" \
              --notes-file RELEASE-NOTES.md
          fi
